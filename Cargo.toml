[workspace]
members = [
  "apps/maimai-stdio",
  "crates/maimai-app",
  "crates/maimai-catalog",
  "crates/maimai-core",
  "crates/maimai-mcp",
  "crates/maimai-providers",
  "crates/maimai-render",
  "crates/maimai-storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
indexmap = "2"
num-bigint = "0.4.8"
num-integer = "0.1.46"
num-rational = "0.4.2"
num-traits = "0.2.19"
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
