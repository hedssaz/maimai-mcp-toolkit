[project]
name = "maimai-mcp-toolkit"
version = "0.1.0"
description = "Local stdio MCP tools for maimai DX song search, score query, group ranking, rendering, and Diving-Fish upload workflow."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0",
  "Pillow>=10.0",
  "pydantic>=2.0",
  "numpy>=1.24",
  "pypinyin>=0.50",
  "pycryptodome>=3.20",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
playwright = [
  "playwright>=1.40",
  "pyecharts>=2.0",
]

[project.scripts]
maimai-search = "maimai_mcp.server:main"
diving-fish-b50 = "diving_fish_b50_mcp.server:main"
maimaidx-render = "maimaidx_render_mcp.server:main"
qq-identity = "qq_identity_mcp.server:main"
maimai-score = "maimai_score_mcp.server:main"
maimai-update = "maimai_update_mcp.server:main"
group-b50 = "group_b50_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
