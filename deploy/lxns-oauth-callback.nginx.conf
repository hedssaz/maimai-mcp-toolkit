# 把本文件中的两个 location 放进已经启用 HTTPS 的 server 块。
# callback 和 poll 都携带敏感查询参数，因此明确关闭访问日志。

location = /lxns/callback {
    access_log off;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
}

location = /lxns/poll {
    access_log off;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
}
