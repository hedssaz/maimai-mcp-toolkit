[package]
name = "maimai-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
maimai-app = { path = "../maimai-app" }
maimai-catalog = { path = "../maimai-catalog" }
maimai-core = { path = "../maimai-core" }
maimai-providers = { path = "../maimai-providers" }
maimai-render = { path = "../maimai-render" }
maimai-storage = { path = "../maimai-storage" }
rand = "0.10"
rmcp = { version = "=3.1.2", default-features = false, features = ["server", "transport-io"] }
rust_decimal.workspace = true
secrecy = "0.10"
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision", "preserve_order"] }
thiserror.workspace = true
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["io-std", "macros", "rt", "sync", "time"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "2"

[lints]
workspace = true
