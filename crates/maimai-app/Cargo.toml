[package]
name = "maimai-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[dependencies]
caseless = "0.2.2"
maimai-catalog = { path = "../maimai-catalog" }
maimai-core = { path = "../maimai-core" }
maimai-providers = { path = "../maimai-providers" }
maimai-render = { path = "../maimai-render" }
maimai-storage = { path = "../maimai-storage" }
num-rational.workspace = true
rust_decimal.workspace = true
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
